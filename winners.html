<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Joobiraa - Winners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0F1B2D">
    <link rel="icon" type="image/png" href="assets/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <script src="js/boot.js"></script>
</head>
<body data-page="winners">
    <div id="site-header"></div>

    <main>
        <div class="container">
            <div class="page-head">
                <h1 class="page-title" data-i18n="title_winners"></h1>
                <p class="page-subtitle" data-i18n="desc_winners"></p>
            </div>

            <div class="section" style="padding-top:12px">
                <div class="toolbar">
                    <div class="chips" id="categoryChips" role="tablist"></div>
                </div>
                <div class="winners-grid" id="winnersGrid"></div>
                <div class="empty-state hidden" id="winnersEmpty">
                    <i class="fa-regular fa-face-frown"></i>
                    <span data-i18n="no_results"></span>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
        let cat = 'all';

        function renderChips() {
            qs('#categoryChips').innerHTML = CATEGORIES.map(c => `
                <button type="button" class="chip ${cat === c.id ? 'active' : ''}" data-cat="${c.id}" role="tab" aria-selected="${cat === c.id}">
                    <i class="fa-solid ${c.icon}"></i> ${L(c)}
                </button>`).join('');
        }

        function renderWinners() {
            const list = AUCTIONS.filter(a => a.status === 'ended' && (cat === 'all' || a.cat === cat));
            qs('#winnersGrid').innerHTML = list.map(winnerCard).join('');
            qs('#winnersEmpty').classList.toggle('hidden', list.length > 0);
        }

        function renderAll() { renderChips(); renderWinners(); }

        function initPage() {
            qs('#categoryChips').addEventListener('click', e => {
                const chip = e.target.closest('[data-cat]');
                if (!chip) return;
                cat = chip.dataset.cat;
                renderAll();
            });
            document.addEventListener('langchange', renderAll);
        }
    </script>
</body>
</html>
