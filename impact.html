<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Joobiraa - Community Impact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0F1B2D">
    <link rel="icon" type="image/png" href="assets/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <script src="js/boot.js"></script>
</head>
<body data-page="impact">
    <div id="site-header"></div>

    <main>
        <div class="container narrow">
            <div class="page-head">
                <h1 class="page-title" data-i18n="title_impact"></h1>
                <p class="page-subtitle" data-i18n="desc_impact"></p>
            </div>
            <div class="section" style="padding-top:12px" id="content"></div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Demo figures; the real page reads them from the payments ledger (20% of all bid fees)
        const IMPACT = { total: 128460, quarter: 41250, target: 640000 };
        const SUPPORT = [
            { icon: 'fa-book', amount: 35000, name: { om: 'Meeshaa barnootaa — Adaamaa', am: 'የትምህርት ቁሳቁስ — አዳማ', en: 'School supplies — Adama' }, date: { om: 'Fulbaana 2026', am: 'መስከረም 2026', en: 'September 2026' } },
            { icon: 'fa-droplet', amount: 52000, name: { om: 'Bishaan qulqulluu — Shaashamannee', am: 'ንጹህ ውሃ — ሻሸመኔ', en: 'Clean water — Shashemene' }, date: { om: 'Hagayya 2026', am: 'ነሐሴ 2026', en: 'August 2026' } },
            { icon: 'fa-kit-medical', amount: 41460, name: { om: 'Deeggarsa fayyaa — Finfinnee', am: 'የጤና ድጋፍ — አዲስ አበባ', en: 'Health support — Addis Ababa' }, date: { om: 'Adoolessa 2026', am: 'ሐምሌ 2026', en: 'July 2026' } }
        ];
        const n = v => v.toLocaleString('en');

        function render() {
            const pct = Math.round(IMPACT.quarter / IMPACT.target * 100);
            qs('#content').innerHTML = `
            <section class="imp-hero">
                <small>${t('lbl_donated')}</small>
                <div class="imp-total">${n(IMPACT.total)}</div>
                <div class="impact-progress"><div class="impact-bar" style="width:${pct}%"></div></div>
                <small>${t('imp_updated')}</small>
            </section>
            <div class="imp-grid">
                <div class="imp-stat"><strong>${n(IMPACT.quarter)}</strong><span>${t('imp_quarter')} (ETB)</span></div>
                <div class="imp-stat"><strong>${n(IMPACT.target)}</strong><span>${t('imp_target')} (ETB)</span></div>
            </div>
            <div class="panel imp-how">
                <div class="panel-title">${t('imp_how_t')}</div>
                <p>${t('imp_how_d')}</p>
                <div class="example"><i class="fa-solid fa-hand-holding-heart" style="color:var(--gold-text)"></i> ${t('imp_example')}</div>
            </div>
            <h2 class="acc-title">${t('imp_given')}</h2>
            <div class="panel">
                <ul class="imp-list">
                    ${SUPPORT.map(s => `
                    <li>
                        <span class="ph-icon"><i class="fa-solid ${s.icon}"></i></span>
                        <div><strong>${L(s.name)}</strong><small>${L(s.date)}</small></div>
                        <span class="amt">${n(s.amount)} <small>${t('currency')}</small></span>
                    </li>`).join('')}
                </ul>
            </div>`;
        }

        function initPage() { document.addEventListener('langchange', render); }
    </script>
</body>
</html>
