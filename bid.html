<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Joobiraa - Auction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0F1B2D">
    <link rel="icon" type="image/png" href="assets/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <script src="js/boot.js"></script>
</head>
<body data-page="auctions">
    <div id="site-header"></div>

    <main>
        <div class="container" id="detail"></div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const auction = getAuction(params.get('id'));
        const startAmount = parseFloat(params.get('amount'));
        let photoIndex = 0;
        let descOpen = false;
        let historyOpen = false;
        let historyShown = HISTORY_PAGE;

        function galleryHTML(a) {
            return `
            <div class="detail-gallery">
                <div class="gallery-main">
                    <div class="gallery-track" id="galleryTrack">
                        ${a.images.map((src, i) => `
                        <div class="gallery-slide is-loading">
                            <img src="${src}" alt="${L(a.name)} — ${i + 1}" ${i === 0 ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async">
                        </div>`).join('')}
                    </div>
                    ${favButton(a.id)}
                    <span class="gallery-count" id="galleryCount">1 / ${a.images.length}</span>
                    <button type="button" class="gallery-nav prev" data-nav="-1" aria-label="Previous photo"><i class="fa-solid fa-chevron-left"></i></button>
                    <button type="button" class="gallery-nav next" data-nav="1" aria-label="Next photo"><i class="fa-solid fa-chevron-right"></i></button>
                    <div class="gallery-dots" id="galleryDots">${a.images.map(() => '<span></span>').join('')}</div>
                </div>
            </div>`;
        }

        // Pass no label to leave out the price column (ended auctions show the amount in the winner block)
        function statsHTML(label, value) {
            return `
            <div class="card-stats ${label ? '' : 'two'}" style="margin-bottom:0">
                ${label ? `<div class="stat-item"><span class="stat-label">${label}</span><span class="stat-value price">${value} <small>${t('currency')}</small></span></div>` : ''}
                <div class="stat-item"><span class="stat-label">${t('lbl_bids')}</span><span class="stat-value count"><i class="fa-solid fa-users"></i> ${compact(auction.bids)}</span></div>
                <div class="stat-item"><span class="stat-label">${t('stat_views')}</span><span class="stat-value views"><i class="fa-regular fa-eye"></i> ${compact(auction.views)}</span></div>
            </div>`;
        }

        function bidPanelHTML(a) {
            if (a.status === 'ended') {
                const mine = a.winner.name === 'me';
                const paid = myBids.paid().includes(a.id);
                return `
                <div class="panel" id="pay">
                    ${winnerBox(a, 'big')}
                    ${statsHTML()}
                    ${mine && paid ? `<p style="margin-top:12px"><span class="status paid">${t('status_paid')}</span></p>` : ''}
                    ${mine && !paid ? `<div class="pay-divider"></div><div id="payForm"></div>` : ''}
                </div>`;
            }
            if (a.status === 'upcoming') {
                return `
                <div class="panel" id="pay">
                    <div class="panel-label">${t('starts_in')}</div>
                    ${timerBoxes(a.startsAt)}
                    ${statsHTML(t('lbl_current_bid'), fmtETB(a.price))}
                    <p class="hint" style="margin-top:12px"><i class="fa-regular fa-bell"></i>${t('upcoming_note')}</p>
                </div>`;
            }
            return `
            <div class="panel" id="pay">
                <div class="panel-label">${t('lbl_ends_in')}</div>
                ${timerBoxes(a.endsAt)}
                ${statsHTML(t('lbl_current_bid'), fmtETB(a.price))}
                <div class="pay-divider"></div>
                <div id="payForm"></div>
            </div>`;
        }

        function render() {
            const root = qs('#detail');
            if (!auction) {
                root.innerHTML = `<div class="empty-state"><i class="fa-regular fa-face-frown"></i>${t('not_found')}<br><br>
                    <a href="index.html" class="btn btn-gold">${t('nav_home')}</a></div>`;
                return;
            }
            document.title = `${L(auction.name)} - Joobiraa`;
            const live = auction.status === 'live';
            const ended = auction.status === 'ended';
            const cat = CATEGORIES.find(c => c.id === auction.cat);
            root.innerHTML = `
            <nav class="breadcrumb">
                <a href="${ended ? 'winners.html' : 'auctions.html'}" data-action="back"><i class="fa-solid fa-arrow-left"></i> ${t(ended ? 'nav_winners' : 'nav_auctions')}</a>
                <span>/</span><span>${L(cat)}</span>
            </nav>
            <div class="detail-grid ${ended ? 'ended' : ''}">
                ${galleryHTML(auction)}
                <div class="detail-info">
                    <div class="detail-status">
                        <span class="badge badge-${live ? 'live' : ended ? 'ended' : 'upcoming'}">
                            ${live ? '<span class="pulse-dot"></span>' : `<i class="fa-${ended ? 'solid fa-flag-checkered' : 'regular fa-clock'}"></i>`} ${t(live ? 'live' : ended ? 'ended' : 'upcoming')}
                        </span>
                        <span class="code-chip">${t('lbl_code')}: <strong>${auction.code}</strong></span>
                    </div>
                    <h1 class="detail-title" style="margin-bottom:14px">${L(auction.name)}</h1>
                    ${bidPanelHTML(auction)}
                </div>
                <div class="detail-extra">
                    <div class="panel accordion ${descOpen ? 'open' : ''}" id="descAccordion">
                        <button type="button" class="accordion-toggle" aria-expanded="${descOpen}">
                            ${t('lbl_description')} <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="accordion-body">
                            <p class="description">${L(auction.desc)}</p>
                            <div class="spec-title">${t('lbl_specs')}</div>
                            <div class="spec-wrap">
                                <table class="spec-table"><tbody>
                                    ${auction.specs.map(([k, v]) => `<tr><th scope="row">${t(k)}</th><td>${dict.en[v] ? t(v) : v}</td></tr>`).join('')}
                                </tbody></table>
                            </div>
                        </div>
                    </div>
                    ${ended ? `
                    <div class="panel accordion ${historyOpen ? 'open' : ''}" id="historyAccordion">
                        <button type="button" class="accordion-toggle" aria-expanded="${historyOpen}">
                            <span>${t('bid_history')} <span class="count-chip">${bidHistory(auction).total.toLocaleString('en')}</span></span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="accordion-body" id="historyBody">${historyOpen ? historyHTML(auction, historyShown) : ''}</div>
                    </div>` : ''}
                </div>
            </div>`;

            const payForm = qs('#payForm');
            if (payForm) {
                renderPayForm(payForm, {
                    auction,
                    kind: live ? 'bid' : 'win',
                    amount: startAmount,
                    // Refresh the bid count (live) or show "Paid" (win) after a short pause on the success screen
                    onDone: () => { if (!live) setTimeout(render, 2500); else qs('.stat-value.count', qs('#pay')).innerHTML = `<i class="fa-solid fa-users"></i> ${compact(auction.bids)}`; }
                });
            }
            wireGallery();
            qs('#descAccordion .accordion-toggle').addEventListener('click', e => {
                descOpen = !descOpen;
                qs('#descAccordion').classList.toggle('open', descOpen);
                e.currentTarget.setAttribute('aria-expanded', descOpen);
            });
            // Bid history is built only when opened (it can be thousands of rows)
            const hist = qs('#historyAccordion');
            if (hist) {
                qs('.accordion-toggle', hist).addEventListener('click', e => {
                    historyOpen = !historyOpen;
                    if (historyOpen && !qs('#historyBody').innerHTML) qs('#historyBody').innerHTML = historyHTML(auction, historyShown);
                    hist.classList.toggle('open', historyOpen);
                    e.currentTarget.setAttribute('aria-expanded', historyOpen);
                });
                qs('#historyBody').addEventListener('click', e => {
                    const more = e.target.closest('[data-history-more]');
                    if (!more) return;
                    historyShown = +more.dataset.historyMore;
                    qs('#historyBody').innerHTML = historyHTML(auction, historyShown);
                });
            }
            tickTimers();
            // Card "Place bid" links here with #pay — jump to the payment form once it exists
            if (!render.scrolled && location.hash === '#pay') { render.scrolled = true; qs('#pay').scrollIntoView({ block: 'start' }); }
        }

        function wireGallery() {
            const track = qs('#galleryTrack');
            const total = auction.images.length;
            const dots = qsa('#galleryDots span');
            // Shimmer placeholder until each photo arrives, then fade it in
            qsa('.gallery-slide img', track).forEach(img => {
                const done = () => img.parentElement.classList.remove('is-loading');
                if (img.complete && img.naturalWidth) done();
                else { img.addEventListener('load', done, { once: true }); img.addEventListener('error', done, { once: true }); }
            });
            const update = i => {
                photoIndex = i;
                qs('#galleryCount').textContent = `${i + 1} / ${total}`;
                dots.forEach((d, j) => d.classList.toggle('active', i === j));
                qs('.gallery-nav.prev').disabled = i === 0;
                qs('.gallery-nav.next').disabled = i === total - 1;
            };
            const go = i => track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
            qsa('.gallery-nav').forEach(b => b.addEventListener('click', () => go(Math.min(total - 1, Math.max(0, photoIndex + +b.dataset.nav)))));
            track.addEventListener('scroll', () => update(Math.round(track.scrollLeft / track.clientWidth)), { passive: true });
            update(photoIndex);
            if (photoIndex) track.scrollLeft = photoIndex * track.clientWidth;
        }

        function initPage() {
            document.addEventListener('langchange', render);
        }
    </script>
</body>
</html>
