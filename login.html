<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Joobiraa - Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/boot.js"></script>
</head>
<body data-page="login">
    <div id="site-header"></div>

    <main>
        <div class="container auth-wrap">
            <div class="auth-card">

                <!-- Step 1: phone number -->
                <form id="phoneStep" novalidate>
                    <div class="auth-icon"><i class="fa-solid fa-mobile-screen"></i></div>
                    <h1 class="auth-title" data-i18n="login_title"></h1>
                    <p class="auth-sub" data-i18n="login_sub"></p>
                    <label class="field-label" for="phone" data-i18n="login_phone"></label>
                    <div class="phone-input">
                        <span class="prefix">+251</span>
                        <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="9XXXXXXXX" autocomplete="tel-national" autofocus>
                    </div>
                    <div class="form-error" id="phoneError"></div>
                    <label class="check-row">
                        <input type="checkbox" id="agree">
                        <span data-i18n-html="agree_policy"></span>
                    </label>
                    <button type="submit" class="btn btn-gold btn-block" data-i18n="login_send"></button>
                </form>

                <!-- Step 2: OTP -->
                <form id="otpStep" class="hidden" novalidate>
                    <div class="auth-icon"><i class="fa-solid fa-message"></i></div>
                    <h1 class="auth-title" data-i18n="otp_title"></h1>
                    <p class="auth-sub" id="otpSub"></p>
                    <div class="otp-boxes" id="otpBoxes">
                        <input type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1">
                        <input type="text" inputmode="numeric" aria-label="Digit 2">
                        <input type="text" inputmode="numeric" aria-label="Digit 3">
                        <input type="text" inputmode="numeric" aria-label="Digit 4">
                        <input type="text" inputmode="numeric" aria-label="Digit 5">
                        <input type="text" inputmode="numeric" aria-label="Digit 6">
                    </div>
                    <div class="form-error" id="otpError"></div>
                    <div class="auth-row">
                        <button type="button" class="link-btn" id="changeNumber" data-i18n="otp_change"></button>
                        <button type="button" class="link-btn" id="resend" disabled></button>
                    </div>
                    <button type="submit" class="btn btn-gold btn-block" data-i18n="otp_verify"></button>
                </form>

                <div class="auth-foot">
                    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="back_home"></span></a>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
        let phone = '';
        let resendTimer;

        function normalizePhone(raw) {
            let d = raw.replace(/\D/g, '');
            if (d.startsWith('251')) d = d.slice(3);
            if (d.startsWith('0')) d = d.slice(1);
            return d;
        }

        function startResendCountdown() {
            const btn = qs('#resend');
            let s = 60;
            btn.disabled = true;
            clearInterval(resendTimer);
            const tick = () => {
                btn.textContent = s > 0 ? t('otp_resend_in')(s) : t('otp_resend');
                btn.disabled = s > 0;
                if (s-- <= 0) clearInterval(resendTimer);
            };
            tick();
            resendTimer = setInterval(tick, 1000);
        }

        function showOtp() {
            qs('#phoneStep').classList.add('hidden');
            qs('#otpStep').classList.remove('hidden');
            qs('#otpSub').innerHTML = t('otp_sub')(fmtPhone(phone));
            qsa('#otpBoxes input').forEach(i => { i.value = ''; });
            qs('#otpBoxes input').focus();
            startResendCountdown();
        }

        function initPage() {
            // Already signed in? go straight home
            if (session.user()) { location.replace('index.html'); return; }

            qs('#agree').addEventListener('change', () => { qs('#phoneError').textContent = ''; });
            qs('#phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); qs('#phoneError').textContent = ''; });

            qs('#phoneStep').addEventListener('submit', e => {
                e.preventDefault();
                phone = normalizePhone(qs('#phone').value);
                if (!/^[79]\d{8}$/.test(phone)) { qs('#phoneError').textContent = t('err_phone'); return; }
                if (!qs('#agree').checked) { qs('#phoneError').textContent = t('err_agree'); return; }
                showOtp(); // real app: POST /auth/otp
            });

            const boxes = qsa('#otpBoxes input');
            boxes.forEach((box, i) => {
                box.addEventListener('input', () => {
                    const digits = box.value.replace(/\D/g, '');
                    qs('#otpError').textContent = '';
                    if (digits.length > 1) {
                        // SMS autofill (one-time-code) drops the whole code into one box
                        digits.slice(0, 6 - i).split('').forEach((d, j) => { boxes[i + j].value = d; });
                        boxes[Math.min(i + digits.length, 5)].focus();
                    } else {
                        box.value = digits;
                        if (digits && i < boxes.length - 1) boxes[i + 1].focus();
                    }
                    if (boxes.every(b => b.value)) qs('#otpStep').requestSubmit();
                });
                box.addEventListener('keydown', e => {
                    if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
                });
                box.addEventListener('paste', e => {
                    const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                    if (!digits) return;
                    e.preventDefault();
                    digits.split('').forEach((d, j) => { if (boxes[j]) boxes[j].value = d; });
                    boxes[Math.min(digits.length, 5)].focus();
                    if (digits.length === 6) qs('#otpStep').requestSubmit();
                });
            });

            qs('#otpStep').addEventListener('submit', e => {
                e.preventDefault();
                const code = boxes.map(b => b.value).join('');
                if (code.length !== 6) { qs('#otpError').textContent = t('otp_err'); return; }
                // Demo: any 6 digits are accepted. Real app: POST /auth/verify
                session.signIn(phone);
                store.set('jb_toast', t('signed_in'));
                const next = new URLSearchParams(location.search).get('next');
                location.href = next && /^[\w-]+\.html/.test(next) ? next : 'index.html';
            });

            qs('#changeNumber').addEventListener('click', () => {
                clearInterval(resendTimer);
                qs('#otpStep').classList.add('hidden');
                qs('#phoneStep').classList.remove('hidden');
                qs('#phone').focus();
            });
            qs('#resend').addEventListener('click', startResendCountdown);

            document.addEventListener('langchange', () => {
                if (phone) qs('#otpSub').innerHTML = t('otp_sub')(fmtPhone(phone));
            });
        }
    </script>
</body>
</html>
