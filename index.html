<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Joobiraa - Auctions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/boot.js"></script>
</head>
<body data-page="home">
    <div id="site-header"></div>

    <!-- HERO -->
    <section class="hero">
        <div class="container hero-grid">
            <div class="hero-content">
                <h1 class="hero-title" data-i18n-html="hero_title"></h1>
                <p class="hero-desc" data-i18n="hero_desc"></p>
                <div class="hero-buttons">
                    <a href="#auctions" class="btn btn-gold" data-i18n="how_cta_browse"></a>
                    <a href="login.html" class="btn btn-ghost-light" id="heroSecondary"></a>
                </div>
                <div class="hero-stats">
                    <div>
                        <div class="hero-stat-num">65+</div>
                        <div class="hero-stat-lbl" data-i18n="nav_winners"></div>
                    </div>
                    <div>
                        <div class="hero-stat-num">1 <span class="currency-lbl"></span></div>
                        <div class="hero-stat-lbl" data-i18n="min_bid_lbl"></div>
                    </div>
                </div>
            </div>
            <div class="hero-visual">
                <a href="bid.html?id=dell" class="hero-ticket" id="heroTicket"></a>
            </div>
        </div>
    </section>

    <main>
        <!-- AUCTIONS -->
        <section id="auctions" class="section">
            <div class="container">
                <div class="section-head">
                    <h2 class="section-title" data-i18n="title_auctions"></h2>
                    <p class="section-desc" data-i18n="subtitle_auctions"></p>
                </div>

                <div class="toolbar">
                    <div class="search-row">
                        <label class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="search" id="searchInput" data-i18n-placeholder="search_placeholder" autocomplete="off">
                        </label>
                        <select id="sortSelect" class="sort-select" aria-label="Sort">
                            <option value="ending" data-i18n="sort_ending"></option>
                            <option value="popular" data-i18n="sort_popular"></option>
                            <option value="price" data-i18n="sort_price"></option>
                        </select>
                    </div>
                    <div class="chips" id="categoryChips" role="tablist"></div>
                </div>

                <div class="auctions-grid" id="auctionsGrid"></div>
                <div class="empty-state hidden" id="auctionsEmpty">
                    <i class="fa-regular fa-face-frown"></i>
                    <span data-i18n="no_results"></span>
                </div>
            </div>
        </section>

        <!-- WINNERS -->
        <section id="winners" class="section">
            <div class="container">
                <div class="section-head">
                    <h2 class="section-title" data-i18n="title_winners"></h2>
                    <p class="section-desc" data-i18n="desc_winners"></p>
                </div>
                <div class="winners-grid" id="winnersGrid"></div>
            </div>
        </section>

        <!-- HOW IT WORKS (listed, always visible) -->
        <section id="how" class="section">
            <div class="container">
                <div class="section-head">
                    <h2 class="section-title" data-i18n="how_title"></h2>
                </div>
                <div id="howList"></div>
            </div>
        </section>

        <!-- IMPACT -->
        <section id="impact" class="section">
            <div class="container">
                <div class="impact">
                    <div>
                        <h2 data-i18n="title_impact"></h2>
                        <p data-i18n="desc_impact"></p>
                    </div>
                    <div class="impact-stats">
                        <div class="impact-number">128,460</div>
                        <p data-i18n="lbl_donated"></p>
                        <div class="impact-progress"><div class="impact-bar"></div></div>
                        <p class="impact-target" data-i18n="lbl_target"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
        const state = { cat: 'all', q: '', sort: 'ending' };

        function renderChips() {
            qs('#categoryChips').innerHTML = CATEGORIES.map(c => `
                <button type="button" class="chip ${state.cat === c.id ? 'active' : ''}" data-cat="${c.id}" role="tab" aria-selected="${state.cat === c.id}">
                    <i class="fa-solid ${c.icon}"></i> ${L(c)}
                </button>`).join('');
        }

        function renderAuctions() {
            const q = state.q.trim().toLowerCase();
            const sorters = {
                ending: (a, b) => a.endsAt - b.endsAt,
                popular: (a, b) => b.bids - a.bids,
                price: (a, b) => a.price - b.price
            };
            const list = AUCTIONS
                .filter(a => a.status === 'live')
                .filter(a => state.cat === 'all' || a.cat === state.cat)
                .filter(a => !q || Object.values(a.name).some(n => n.toLowerCase().includes(q)))
                .sort(sorters[state.sort]);
            qs('#auctionsGrid').innerHTML = list.map(auctionCard).join('');
            qs('#auctionsEmpty').classList.toggle('hidden', list.length > 0);
            tickTimers();
        }

        function renderWinners() {
            qs('#winnersGrid').innerHTML = AUCTIONS.filter(a => a.status === 'ended' && a.winner.name !== 'me').map(a => `
                <a class="winner-card" href="bid.html?id=${a.id}">
                    <div class="winner-trophy"><i class="fa-solid fa-trophy"></i></div>
                    <img src="${a.images[0]}" alt="${L(a.name)}" loading="lazy">
                    <p class="winner-item">${L(a.name)}</p>
                    <div class="winner-name">${a.winner.name}</div>
                    <div class="winner-bid">${fmtETB(a.winner.bid)} ${t('currency')}</div>
                </a>`).join('');
        }

        function renderHeroTicket() {
            const a = getAuction('dell');
            qs('#heroTicket').innerHTML = `
                <div class="ticket-badge">● ${t('live')}</div>
                <img src="${a.images[0]}" alt="${L(a.name)}">
                <h3>${L(a.name)}</h3>
                <div class="ticket-row"><span>${t('lbl_bids')}</span><strong>${a.bids}</strong></div>
                <div class="ticket-row"><span>${t('lbl_ends_in')}</span><strong data-ends="${a.endsAt}"></strong></div>`;
        }

        // Second hero button is the sign-in entry point (My Bids once signed in)
        function renderHeroSecondary() {
            const btn = qs('#heroSecondary');
            const signedIn = !!session.user();
            btn.href = signedIn ? 'my-bids.html' : 'login.html';
            btn.innerHTML = signedIn
                ? `<i class="fa-solid fa-gavel"></i> ${t('nav_mybids')}`
                : `<i class="fa-solid fa-mobile-screen"></i> ${t('nav_signin')}`;
        }

        function renderAll() {
            qs('#howList').innerHTML = howItWorksHTML();
            renderChips(); renderAuctions(); renderWinners(); renderHeroTicket(); renderHeroSecondary(); tickTimers();
        }

        function initPage() {
            qs('#categoryChips').addEventListener('click', e => {
                const chip = e.target.closest('[data-cat]');
                if (!chip) return;
                state.cat = chip.dataset.cat;
                renderChips(); renderAuctions();
            });
            qs('#searchInput').addEventListener('input', e => { state.q = e.target.value; renderAuctions(); });
            qs('#sortSelect').addEventListener('change', e => { state.sort = e.target.value; renderAuctions(); });
            document.addEventListener('langchange', renderAll);
        }
    </script>
</body>
</html>
